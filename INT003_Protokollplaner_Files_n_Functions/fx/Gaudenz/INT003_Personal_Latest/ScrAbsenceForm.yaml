                        OnSelect: "=With(\n    {\n        empID: LookUp(\n            Pers001_Employees,\n            Lower(Trim(Email)) = Lower(Trim(User().Email)),\n            ID\n        )\n    },\n    If(\n        IsBlank(empID),\n        Set(varShowInfoPopup, true),\n\n        // ⭐ STEP 1: Create the record (fields only)\n        Set(\n            gblAbsence,\n            Patch(\n                Pers001_Absences,\n                Defaults(Pers001_Absences),\n                {\n                    Employee_Id: { Id: empID, Value: \"\" },\n                    Starts: DpStarts_1.SelectedDate,\n                    Ends: DpEnds_1.SelectedDate,\n                    Remark: TxtRemark_1.Text,\n                    Reason: DrpReason_1.Selected,\n                    Status: { Value: \"gemeldet\" }\n                }\n            )\n        );\n\n        // ⭐ STEP 2: Bind the form to the new record\n        Set(varCurrentRecord, gblAbsence);\n        EditForm(Form1_1);\n\n        // ⭐ STEP 3: Submit the form (this uploads the attachment)\n        SubmitForm(Form1_1)\n    )\n);\n\n\n\n\n\n/*\n// ATTACHMENT WORKING BUT NO OTHER FIELDS \nWith(\n    {\n        // 1. Get Employee ID\n        empID: LookUp(Pers001_Employees, Email = Lower(User().Email), ID),\n        \n        // 2. Capture files immediately into a local variable\n        myFiles: DataCardValue7_1.Attachments\n    },\n\n    // ONLY proceed if Employee ID exists\n    If(\n        !IsBlank(empID), \n        \n        // --- STEP 1: Create the Record ---\n        Set(\n            gblAbsence,\n            Patch(\n                Pers001_Absences,\n                Defaults(Pers001_Absences),\n                {\n                    Employee_Id: { Id: empID, Value: \"\" },\n                    Starts: DpStarts_1.SelectedDate,\n                    Ends: DpEnds_1.SelectedDate,\n                    Remark: TxtRemark_1.Text,\n                    Reason: DrpReason_1.Selected,\n                    Status: { Value: \"gemeldet\" }\n                }\n            )\n        );\n\n        // --- STEP 2: CRITICAL - Bind the Form ---\n        // Set variable so Form Item property reacts\n        Set(varCurrentRecord, gblAbsence);\n        \n        // Refresh to ensure SharePoint has the new ID ready\n        Refresh(Pers001_Absences);\n\n        // --- STEP 3: Submit ONLY if there are files ---\n        If(\n            !IsEmpty(myFiles),\n            \n            Notify(\"Creating record and uploading attachments...\", NotificationType.Information);\n            SubmitForm(Form1_1);\n            \n            // Reset inputs immediately after submit command fires\n            Reset(DpStarts_1);\n            Reset(DpEnds_1);\n            Reset(TxtRemark_1);\n            Reset(DrpReason_1);\n            \n            // Clear binding variable so form resets correctly next time\n            Set(varCurrentRecord, Blank());\n            // Note: ResetForm/Form NewForm will happen in OnSuccess or at the end safely\n        );\n\n        // --- STEP 4: Final Cleanup ---\n        // Refresh data collections to show the new record\n        Refresh(Pers001_Absences);\n        \n        ClearCollect(\n            colAbsences,\n            AddColumns(\n                Pers001_Absences,\n                EmployeeId, Employee_Id.Id,\n                EmployeeName, LookUp(ColMain_Employees, ID = Employee_Id.Id, EmployeeFullName),\n                ReasonValue, Reason.Value,\n                StatusValue, Status.Value\n            )\n        );\n\n        // Notify success if NO files were uploaded (since we didn't trigger OnSuccess logic)\n        If(\n            IsEmpty(myFiles),\n            Notify(\"Record created successfully (no attachments)\", NotificationType.Success)\n        );\n\n        // Ensure Form is reset to New state for next use\n        // We do this unconditionally here, but ensure varCurrentRecord was cleared above\n        ResetForm(Form1_1);\n        NewForm(Form1_1);\n        \n        // Also clear inputs one last time if they weren't cleared in the 'If' block above\n        Reset(DpStarts_1);\n        Reset(DpEnds_1);\n        Reset(TxtRemark_1);\n        Reset(DrpReason_1);\n    );\n\n    // If No Employee found (outside the main If block):\n    // We already set the popup, but let's ensure UI is clean\n    Set(varShowInfoPopup, true);\n    Reset(DpStarts_1);\n    Reset(DpEnds_1);\n    Reset(TxtRemark_1);\n    Reset(DrpReason_1);\n    ResetForm(Form1_1);\n    NewForm(Form1_1);\n);\n*/\n\n/*\n    // Full Code working with all BUT ATTACHMENT ! inputfileds correct into List Pers001_Absences:\n    // @gaudenz\n    With(\n        {\n            gblEmployeeID:\n                LookUp(\n                    Pers001_Employees,\n                    Email = Lower(User().Email),\n                    ID\n                )\n        },\n        If(\n            IsBlank(gblEmployeeID),\n\n            // FALL: Kein Employee oder keine ID\n            Set(varShowInfoPopup, true),\n\n            // FALL: Employee vorhanden -> Step 1: Create the core record first\n            Set(\n                gblAbsence,\n                Patch(\n                    Pers001_Absences,\n                    Defaults(Pers001_Absences),\n                    {\n                        Employee_Id: {\n                            Id: gblEmployeeID,\n                            Value: \"\"\n                        },\n                        Starts: DpStarts_1.SelectedDate,\n                        Ends: DpEnds_1.SelectedDate,\n                        Remark: TxtRemark_1.Text,\n                        Reason: DrpReason_1.Selected,\n                        Status: { Value: \"gemeldet\" }\n                    }\n                )\n            );\n\n            // ⭐ Step 2: Push attachment file binary safely \n            If(\n                !IsEmpty(DataCardValue7_1.Attachments),\n                \n                // Forces Form1_1 to prepare for an Edit commit matching our fresh gblAbsence row\n                EditForm(Form1_1);\n                \n                // Submits the standalone file attachment data directly to your newly created absence ID\n                SubmitForm(Form1_1)\n            );\n\n            // Step 3: Track local file paths after successful creation\n            If(\n                !IsEmpty(DataCardValue7_1.Attachments),\n                Collect(\n                    colAbsenceFiles,\n                    {\n                        AbsenceId: gblAbsence.ID,\n                        EmployeeId: gblEmployee.ID,\n                        EmployeeName: gblEmployee.First_Name & \" \" & gblEmployee.Last_Name,\n                        FileName: Last(DataCardValue7_1.Attachments).Name,\n                        FileUrl: Last(gblAbsence.Attachments).AbsoluteUri\n                    }\n                )\n            );\n\n            Set(varShowSuccess, true)\n        )\n    );\n\n    // Synchronize changes securely with your SharePoint environment\n    Refresh(Pers001_Absences);\n\n    // Rebuild your admin management collection layout tracking grid\n    ClearCollect(\n        colAbsences,\n        AddColumns(\n            Pers001_Absences,\n            EmployeeId, Employee_Id.Id,\n            EmployeeName, LookUp(ColMain_Employees, ID = Employee_Id.Id, EmployeeFullName),\n            ReasonValue, Reason.Value,\n            StatusValue, Status.Value\n        )\n    );\n\n    // Clear form input UI back to fresh defaults\n    Reset(DpStarts_1);\n    Reset(DpEnds_1);\n    Reset(TxtRemark_1);\n    Reset(DrpReason_1);\n\n    // Safely clear file cache container without triggering validation blocks\n    ResetForm(Form1_1);\n    NewForm(Form1_1);\n*/\n/// --------\n\n\n//// ----------\n /*\n \n    // Version flow \n    // @gaudenz\n    With(\n        {\n            gblEmployeeID:\n                LookUp(\n                    Pers001_Employees,\n                    Email = Lower(User().Email),\n                    ID\n                )\n        },\n        If(\n            IsBlank(gblEmployeeID),\n\n            // FALL: Kein Employee oder keine ID\n            Set(varShowInfoPopup, true),\n\n            // FALL: Employee vorhanden -> Patch ausführen\n            Set(\n                gblAbsence,\n                Patch(\n                    Pers001_Absences,\n                    Defaults(Pers001_Absences),\n                    {\n                        Employee_Id: {\n                            Id: gblEmployeeID,\n                            Value: \"\"\n                        },\n                        Starts: DpStarts_1.SelectedDate,\n                        Ends: DpEnds_1.SelectedDate,\n                        Remark: TxtRemark_1.Text,\n                        Reason: DrpReason_1.Selected,\n                        Status: { Value: \"gemeldet\" }\n                    }\n                )\n            );\n\n            Set(varShowSuccess, true)\n        )\n    );\n\n    // ⭐ Force SharePoint to give fresh data\n    Refresh(Pers001_Absences);\n\n    // ⭐ Rebuild your admin collection\n    ClearCollect(\n        colAbsences,\n        AddColumns(\n            Pers001_Absences,\n            EmployeeId, Employee_Id.Id,\n            EmployeeName, LookUp(ColMain_Employees, ID = Employee_Id.Id, EmployeeFullName),\n            ReasonValue, Reason.Value,\n            StatusValue, Status.Value\n        )\n    );\n*/\n// ---------------------------------------\n\n    // 3b. Upload doctor note image (from AddMediaButton1)\n    //#fixed-refresh-ScrAllAbsencesList-after-new-absence-form-sent\n    /*\n    If(\n        !IsBlank(AddMediaButton1.FileName),\n        With(\n            {\n                _flowResult: Flow_UploadAbsenceDoc.Run(\n                    AddMediaButton1.FileName,\n                    gblAbsence.ID,\n                    gblEmployee.ID,\n                    gblEmployee.First_Name & \" \" & gblEmployee.Last_Name,\n                    {\n                        name: AddMediaButton1.FileName,\n                        contentBytes: Mid(\n                            JSON(AddMediaButton1.Media, JSONFormat.IncludeBinaryData),\n                            2,\n                            Len(JSON(AddMediaButton1.Media, JSONFormat.IncludeBinaryData)) - 2\n                        )\n                    }\n                )\n            },\n            Collect(\n                colAbsenceFiles,\n                {\n                    AbsenceId: gblAbsence.ID,\n                    EmployeeId: gblEmployee.ID,\n                    EmployeeName: gblEmployee.First_Name & \" \" & gblEmployee.Last_Name,\n                    FileName: AddMediaButton1.FileName,\n                    FileUrl:\n                        \"https://szhglobal.sharepoint.com/sites/seb-spo-abs-monitor-dev/Freigegebene%20Dokumente/Files/\" &\n                        AddMediaButton1.FileName\n                }\n            )\n        )\n    );\n    */\n\n    // ------------------------------------\n    /*\n    // Reset controls\n    Reset(DpStarts_1);\n    Reset(DpEnds_1);\n    Reset(TxtRemark_1);\n    Reset(DrpReason_1);\n    // #reset-label-filename-uploaded-onselect-send-form\n    Reset(AddMediaButton1_1);\n*/\n\n// DEBUG CALL NOTIFICATION\n// Notify(\n//     \"FileName: \" & AddMediaButton1.FileName &\n//     \" | AbsenceId: \" & Text(gblAbsence.ID) &//     \" | EmployeeId: \" & Text(gblEmployee.ID) &\n//     \" | EmployeeName: \" & gblEmployee.First_Name & \" \" & gblEmployee.Last_Name,\n//     NotificationType.Information\n// );\n// DEBUG CALL NOTIFICATION\n// Notify(\n//     \"FileName: \" & AddMediaButton1.FileName &\n//     \" | AbsenceId: \" & Text(gblAbsence.ID) &//     \" | EmployeeId: \" & Text(gblEmployee.ID) &\n//     \" | EmployeeName: \" & gblEmployee.First_Name & \" \" & gblEmployee.Last_Name,\n//     NotificationType.Information\n// );\n\n\n"
