Screens:
  ScrAbsenceForm:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// @chris #update-col-main-employees ///////////////////////////////////////////////////////////////////////////////////////
        // IT IS NOT NECESSARY TO RELOAD Pers001_Employees INTO ColMain_Employees FOR THIS SCREEN!
        ////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

        // --- SETUP ScrAbsenceForm.OnVisible @gaudenz START
        // #settings-to-make-ScrAllAbsencesList-gaudenz-work

        // Reload absences so new records appear immediately
        // Reload employees
        ClearCollect(
            ColMain_Employees,
            AddColumns(
                Pers001_Employees,
                EmployeeFullName, First_Name & " " & Last_Name
            )
        );

        // Reload absences
        ClearCollect(
            colAbsences,
            AddColumns(
                Pers001_Absences,
                EmployeeId, Employee_Id.Id,
                EmployeeName,
                    LookUp(
                        ColMain_Employees,
                        ID = Employee_Id.Id,
                        EmployeeFullName
                    ),
                ReasonValue, Reason.Value,
                StatusValue, Status.Value
            )
        );

        // Reload employee filter list
        ClearCollect(
            colEmployeeFilter,
            { EmployeeName: "Alle" }
        );
        ForAll(
            ColMain_Employees, // #update-col-main-employees
            Collect(colEmployeeFilter, { EmployeeName: EmployeeFullName })
        );

        // Set current employee
        Set(
            gblEmployee,
            LookUp(
                ColMain_Employees, // #update-col-main-employees 
                Email = User().Email)
        );
        // --- SETUP ScrAbsenceForm.OnVisible @gaudenz STOPP
